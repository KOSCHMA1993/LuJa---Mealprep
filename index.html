<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#356859">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Unser Essensplan</title>

  <link rel="manifest" href="manifest.webmanifest?v=9">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="v9-styles.css?v=9">

  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
</head>

<body>

  <header>
    <div>
      <strong>
        Unser Essensplan
        <small class="version">v9</small>
      </strong>

      <small id="status">Nicht verbunden</small>
    </div>

    <button id="logout" class="ghost hidden" type="button">
      Abmelden
    </button>
  </header>

  <main>

    <section id="setup" class="card">
      <h1>Einmalig verbinden</h1>

      <p>
        Trage die Supabase-Projekt-URL und den öffentlichen
        Publishable- beziehungsweise Anon-Key ein.
      </p>

      <label>
        Projekt-URL

        <input
          id="url"
          placeholder="https://dein-projekt.supabase.co"
        >
      </label>

      <label>
        Publishable- oder Anon-Key

        <input
          id="key"
          type="password"
          placeholder="sb_publishable_... oder eyJ..."
        >
      </label>

      <button id="saveSetup" type="button">
        Speichern
      </button>

      <p class="hint">
        Niemals den service_role-Key oder das Datenbankpasswort verwenden.
      </p>
    </section>

    <section id="auth" class="card hidden">
      <h1>Anmelden</h1>

      <label>
        E-Mail

        <input
          id="email"
          type="email"
          autocomplete="email"
        >
      </label>

      <label>
        Passwort

        <input
          id="password"
          type="password"
          minlength="6"
          autocomplete="current-password"
        >
      </label>

      <div class="row">
        <button id="signin" type="button">
          Anmelden
        </button>

        <button id="signup" class="secondary" type="button">
          Registrieren
        </button>
      </div>

      <p id="authMsg" class="hint"></p>
    </section>

    <section id="app" class="hidden">

      <nav>
        <button data-page="plan" class="active" type="button">
          Woche
        </button>

        <button data-page="recipes" type="button">
          Rezepte
        </button>

        <button data-page="shopping" type="button">
          Einkauf
        </button>
      </nav>

      <div id="plan" class="page">

        <div class="title">
          <h1>Wochenplan</h1>

          <button data-open="mealDialog" type="button">
            + Essen
          </button>
        </div>

        <div id="planList"></div>
      </div>

      <div id="recipes" class="page hidden">

        <div class="title">
          <h1>Rezepte</h1>

          <button data-open="recipeDialog
