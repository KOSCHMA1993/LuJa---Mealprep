<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#356859"><meta name="apple-mobile-web-app-capable" content="yes"><title>Unser Essensplan</title><link rel="manifest" href="manifest.webmanifest?v=11"><link rel="stylesheet" href="styles.css?v=11"><link rel="icon" href="icon.svg" type="image/svg+xml"></head><body>
<header><div><strong>Unser Essensplan <small class="version">v11</small></strong><small id="status">Nicht verbunden</small></div><button id="logout" class="ghost hidden" type="button">Abmelden</button></header>
<main><section id="setup" class="card"><h1>Einmalig verbinden</h1><label>Projekt-URL<input id="url" placeholder="https://dein-projekt.supabase.co"></label><label>Publishable- oder Anon-Key<input id="key" type="password"></label><button id="saveSetup" type="button">Speichern</button><p class="hint">Nur den Publishable- oder Anon-Key verwenden.</p></section>
<section id="auth" class="card hidden"><h1>Anmelden</h1><label>E-Mail<input id="email" type="email"></label><label>Passwort<input id="password" type="password"></label><div class="row"><button id="signin" type="button">Anmelden</button><button id="signup" class="secondary" type="button">Registrieren</button></div><p id="authMsg" class="hint"></p></section>
<section id="app" class="hidden"><nav><button data-page="plan" class="active">Woche</button><button data-page="recipes">Rezepte</button><button data-page="shopping">Einkauf</button></nav>
<div id="plan" class="page"><div class="title"><h1>Unsere Woche</h1><small>Freitag bis Donnerstag</small></div><div id="planList"></div></div>
<div id="recipes" class="page hidden"><div class="title"><h1>Rezepte</h1><button id="newRecipe">+ Rezept</button></div><input id="recipeSearch" placeholder="Rezepte suchen"><div id="recipeList" class="grid"></div></div>
<div id="shopping" class="page hidden"><div class="title"><h1>Einkaufsliste</h1><div><button id="dmQuick" class="secondary">DM-Produkte</button><button id="newItem">+ Artikel</button></div></div><div class="store-filter"><button class="chip active" data-store="">Alle</button><button class="chip" data-store="Naturgut">Naturgut</button><button class="chip" data-store="Lidl">Lidl</button><button class="chip" data-store="DM">DM</button><button class="chip" data-store="Sonstiges">Sonstiges</button></div><div id="shoppingList"></div><button id="clearDone" class="secondary">Erledigte löschen</button></div></section></main>
<dialog id="mealDialog"><button class="x" type="button">×</button><form id="mealForm"><h2>Essen auswählen</h2><input name="meal_id" type="hidden"><input name="date" type="hidden"><label>Tag<input name="day_label" disabled></label><label>Mahlzeit<select name="slot"><option>Abendessen</option><option>Mittagessen</option></select></label><label>Rezept<select name="recipe_id"></select></label><label>Oder freier Eintrag<input name="free_text" placeholder="Reste, Essen gehen …"></label><div class="row"><button class="secondary cancel" type="button">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog>
<dialog id="recipeDialog"><button class="x" type="button">×</button><form id="recipeForm"><h2>Rezept</h2><input name="recipe_id" type="hidden"><input name="existing_image_url" type="hidden"><label>Name<input name="name" required></label><label>Kategorie<input name="category"></label><label>Minuten<input name="duration" type="number" min="0"></label><label>Standardportionen<input name="servings" type="number" min="1" value="2"></label><label>Foto aufnehmen oder auswählen<input name="image" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><img id="preview" class="preview hidden" alt="Bildvorschau"><label>Zutaten <small>Menge | Einheit | Zutat | Bereich | Geschäft</small><textarea name="ingredients" rows="8"></textarea></label><label>Zubereitung<textarea name="instructions" rows="6"></textarea></label><div class="row"><button class="secondary cancel" type="button">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog>
<dialog id="itemDialog"><button class="x" type="button">×</button><form id="itemForm"><h2>Artikel hinzufügen</h2><label>Artikel<input name="name" required></label><label>Menge<input name="quantity" type="number" step="0.01"></label><label>Einheit<input name="unit"></label><label>Bereich<input name="category"></label><label>Geschäft<select name="store"><option>Naturgut</option><option>Lidl</option><option>DM</option><option>Sonstiges</option></select></label><div class="row"><button class="secondary cancel" type="button">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog>
<dialog id="dmDialog"><button class="x" type="button">×</button><h2>DM-Standardprodukte</h2><div id="dmProducts" class="dm-grid"></div><div class="row"><button class="secondary cancel" type="button">Abbrechen</button><button id="addDm" type="button">Auswahl hinzufügen</button></div></dialog><div id="toast"></div><script type="module" src="app.js?v=11"></script></body></html>
